server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Limite de upload: o multer no backend aceita até 15 MB; o nginx precisa
    # permitir o mesmo tamanho senão bloqueia com 413 (Request Entity Too Large).
    client_max_body_size 15m;

    # Proxy da API na MESMA origem (cookie first-party; SSE sem buffering).
    location /api/ {
        proxy_pass https://smartjuris-api-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host smartjuris-api-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
