server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    # Domínio canônico: apex -> www (evita conteúdo duplicado).
    if ($host = smartjuris.com.br) {
        return 301 https://www.smartjuris.com.br$request_uri;
    }

    include /etc/nginx/snippets/security-headers.conf;

    # Home = SPA (landing + app). O checkout retorna em /?r=assinatura.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Assets do Vite têm hash no nome: cache longo.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        default_type application/xml;
        try_files $uri =404;
    }

    # Limite de upload: o multer no backend aceita até 15 MB; o nginx precisa
    # permitir o mesmo tamanho senão bloqueia com 413 (Request Entity Too Large).
    client_max_body_size 15m;

    # Proxy da API na MESMA origem (cookie first-party; SSE sem buffering).
    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass https://smartjuris-api-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host smartjuris-api-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Páginas públicas pré-renderizadas (/planos -> planos.html) e arquivos estáticos.
    # Caminhos desconhecidos retornam 404 real (com noindex), não a SPA.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
